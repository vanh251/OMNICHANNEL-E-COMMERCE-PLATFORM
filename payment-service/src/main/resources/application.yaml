server:
  port: ${PAYMENT_SERVICE_PORT:8084}

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${PAYMENT_DB:payment_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate.jdbc.batch_size: 50
      hibernate.order_updates: true

  rabbitmq:
    publisher-confirm-type: simple
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:rabbit123}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        concurrency: ${RABBITMQ_CONSUMERS:4}
        max-concurrency: ${RABBITMQ_CONSUMERS:4}
        prefetch: ${RABBITMQ_PREFETCH:50}

outbox:
  enabled: ${OUTBOX_ENABLED:true}
  poll-ms: ${OUTBOX_POLL_MS:50}
  batch-size: ${OUTBOX_BATCH_SIZE:200}
  confirm-timeout-ms: ${OUTBOX_CONFIRM_TIMEOUT_MS:5000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

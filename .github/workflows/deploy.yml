name: Deploy Production

on:
  workflow_run:
    workflows:
      - Docker Build & Push
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 60m
          script: |
            set -e

            cd /opt/omnichannel-ecommerce

            echo "=== Disk usage before deploy ==="
            df -h /

            echo "=== Free up disk: remove dangling images & stopped containers ==="
            docker container prune -f
            docker image prune -f

            echo "=== Disk usage after cleanup ==="
            df -h /

            echo "=== Sync latest repo configurations ==="
            git pull origin main

            echo "=== Pull latest images ==="
            docker compose -f docker-compose.production.yml pull

            echo "=== Restart services ==="
            docker compose -f docker-compose.production.yml up -d --remove-orphans

            echo "=== Wait for services to be healthy (max 3 minutes) ==="
            timeout 180 bash -c \
              'until docker compose -f docker-compose.production.yml ps | grep -E "running|healthy"; do
                echo "Waiting for services..."; sleep 5;
              done' || echo "Warning: some services may not be healthy yet"

            echo "=== Remove unused images after deploy ==="
            docker image prune -f

            echo "=== Disk usage after deploy ==="
            df -h /

            echo "=== Deployment completed ==="
            docker compose -f docker-compose.production.yml ps
name: CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest

    outputs:
      identity: ${{ steps.filter.outputs.identity }}
      product: ${{ steps.filter.outputs.product }}
      order: ${{ steps.filter.outputs.order }}
      payment: ${{ steps.filter.outputs.payment }}
      notification: ${{ steps.filter.outputs.notification }}
      gateway: ${{ steps.filter.outputs.gateway }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            identity:
              - 'identity-service/**'

            product:
              - 'product-service/**'

            order:
              - 'order-inventory-service/**'

            payment:
              - 'payment-service/**'

            notification:
              - 'notification-service/**'

            gateway:
              - 'api-gateway/**'

  identity:
    name: Test Identity Service
    needs: detect-changes
    if: needs.detect-changes.outputs.identity == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: identity-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Test
        run: ./gradlew clean test

  product:
    name: Test Product Service
    needs: detect-changes
    if: needs.detect-changes.outputs.product == 'true'
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin123
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: product-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Test
        env:
          SPRING_DATA_MONGODB_URI: mongodb://admin:admin123@localhost:27017/product_test_db?authSource=admin
        run: ./gradlew clean test

  order:
    name: Test Order Inventory Service
    needs: detect-changes
    if: needs.detect-changes.outputs.order == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: order-inventory-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Test
        run: ./gradlew clean test

  payment:
    name: Test Payment Service
    needs: detect-changes
    if: needs.detect-changes.outputs.payment == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: payment-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Test
        run: ./gradlew clean test

  notification:
    name: Test Notification Service
    needs: detect-changes
    if: needs.detect-changes.outputs.notification == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: notification-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Test
        run: ./gradlew clean test

  gateway:
    name: Test API Gateway
    needs: detect-changes
    if: needs.detect-changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Test
        run: ./gradlew clean test

  infrastructure:
    name: Validate Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -f docker-compose.production.yml config --quiet

      - name: Validate Prometheus
        run: >-
          docker run --rm
          -v "$PWD/infrastructure/prometheus:/etc/prometheus:ro"
          --entrypoint promtool prom/prometheus:v2.55.1
          check config /etc/prometheus/prometheus.yml

      - name: Validate Loki
        run: >-
          docker run --rm
          -v "$PWD/infrastructure/loki:/etc/loki:ro"
          grafana/loki:3.7.0
          -config.file=/etc/loki/loki.yml -verify-config=true

      - name: Validate Alloy
        run: >-
          docker run --rm
          -v "$PWD/infrastructure/alloy:/etc/alloy:ro"
          grafana/alloy:v1.18.0 validate /etc/alloy/config.alloy

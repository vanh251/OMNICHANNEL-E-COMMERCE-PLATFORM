services:

  # =====================================================
  # POSTGRESQL
  # =====================================================
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${IDENTITY_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${IDENTITY_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ecommerce-network

  # =====================================================
  # MONGODB
  # =====================================================
  mongodb:
    image: mongo:7
    container_name: ecommerce-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ecommerce-network

  # =====================================================
  # REDIS
  # =====================================================
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ecommerce-network

  # =====================================================
  # RABBITMQ
  # =====================================================
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ecommerce-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - ecommerce-network

  # =====================================================
  # SPRING BOOT SERVICES (PRODUCTION FROM GHCR)
  # =====================================================

  identity-service:
    image: ${IMAGE_PREFIX:-ghcr.io/vanh251/omnichannel}/identity-service:${IMAGE_TAG:-latest}
    container_name: ecommerce-identity-service
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
      IDENTITY_SERVICE_PORT: ${IDENTITY_SERVICE_PORT:-8081}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      IDENTITY_DB: ${IDENTITY_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
    ports:
      - "${IDENTITY_SERVICE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - ecommerce-network

  product-service:
    image: ${IMAGE_PREFIX:-ghcr.io/vanh251/omnichannel}/product-service:${IMAGE_TAG:-latest}
    container_name: ecommerce-product-service
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
      PRODUCT_SERVICE_PORT: ${PRODUCT_SERVICE_PORT:-8082}
      MONGO_HOST: ${MONGO_HOST:-mongodb}
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_DATABASE: ${MONGO_DATABASE}
      SPRING_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@${MONGO_HOST:-mongodb}:${MONGO_PORT:-27017}/${MONGO_DATABASE}?authSource=admin
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@${MONGO_HOST:-mongodb}:${MONGO_PORT:-27017}/${MONGO_DATABASE}?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - ecommerce-network

  order-inventory-service:
    image: ${IMAGE_PREFIX:-ghcr.io/vanh251/omnichannel}/order-inventory-service:${IMAGE_TAG:-latest}
    container_name: ecommerce-order-inventory-service
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
      ORDER_SERVICE_PORT: ${ORDER_SERVICE_PORT:-8083}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ORDER_DB: ${ORDER_DB}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - ecommerce-network

  payment-service:
    image: ${IMAGE_PREFIX:-ghcr.io/vanh251/omnichannel}/payment-service:${IMAGE_TAG:-latest}
    container_name: ecommerce-payment-service
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
      PAYMENT_SERVICE_PORT: ${PAYMENT_SERVICE_PORT:-8084}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PAYMENT_DB: ${PAYMENT_DB}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - ecommerce-network

  notification-service:
    image: ${IMAGE_PREFIX:-ghcr.io/vanh251/omnichannel}/notification-service:${IMAGE_TAG:-latest}
    container_name: ecommerce-notification-service
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
      NOTIFICATION_SERVICE_PORT: ${NOTIFICATION_SERVICE_PORT:-8085}
      MONGO_HOST: ${MONGO_HOST:-mongodb}
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      SPRING_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@${MONGO_HOST:-mongodb}:${MONGO_PORT:-27017}/notification_db?authSource=admin
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@${MONGO_HOST:-mongodb}:${MONGO_PORT:-27017}/notification_db?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - ecommerce-network

  api-gateway:
    image: ${IMAGE_PREFIX:-ghcr.io/vanh251/omnichannel}/api-gateway:${IMAGE_TAG:-latest}
    container_name: ecommerce-api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"
      GATEWAY_PORT: ${GATEWAY_PORT:-8080}
      IDENTITY_SERVICE_HOST: identity-service
      IDENTITY_SERVICE_PORT: ${IDENTITY_SERVICE_PORT:-8081}
      PRODUCT_SERVICE_HOST: product-service
      PRODUCT_SERVICE_PORT: ${PRODUCT_SERVICE_PORT:-8082}
      ORDER_SERVICE_HOST: order-inventory-service
      ORDER_SERVICE_PORT: ${ORDER_SERVICE_PORT:-8083}
      PAYMENT_SERVICE_HOST: payment-service
      PAYMENT_SERVICE_PORT: ${PAYMENT_SERVICE_PORT:-8084}
      NOTIFICATION_SERVICE_HOST: notification-service
      NOTIFICATION_SERVICE_PORT: ${NOTIFICATION_SERVICE_PORT:-8085}
    depends_on:
      identity-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - ecommerce-network

  # =====================================================
  # PROMETHEUS
  # =====================================================
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ecommerce-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - ecommerce-network

  # =====================================================
  # GRAFANA
  # =====================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: ecommerce-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - ecommerce-network

# =======================================================
# VOLUMES
# =======================================================
volumes:
  postgres_data:
    name: ecommerce_postgres_data
  mongodb_data:
    name: ecommerce_mongodb_data
  redis_data:
    name: ecommerce_redis_data
  rabbitmq_data:
    name: ecommerce_rabbitmq_data
  prometheus_data:
    name: ecommerce_prometheus_data
  grafana_data:
    name: ecommerce_grafana_data

# =======================================================
# NETWORK
# =======================================================
networks:
  ecommerce-network:
    name: ecommerce-network
    driver: bridge

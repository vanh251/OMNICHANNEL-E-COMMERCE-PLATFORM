# payOS domain. Certbot adds TLS and HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name api-vanhdz.duckdns.org;

    client_max_body_size 1m;

    # payOS must reach this endpoint even when /api/ has a demo IP allowlist.
    location = /api/payments/webhooks/payos {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ^~ /api/payments/payos/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Actuator and operational consoles remain accessible through SSH only.
    location / {
        return 404;
    }
}

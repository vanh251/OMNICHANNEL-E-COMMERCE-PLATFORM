server:
  port: ${PRODUCT_SERVICE_PORT:8082}

spring:
  application:
    name: product-service

  mongodb:
    uri: mongodb://${MONGO_ROOT_USERNAME:admin}:${MONGO_ROOT_PASSWORD:admin123}@${MONGO_HOST:mongodb}:${MONGO_PORT:27017}/${MONGO_DATABASE:product_db}?authSource=admin
  data:
    mongodb:
      uri: mongodb://${MONGO_ROOT_USERNAME:admin}:${MONGO_ROOT_PASSWORD:admin123}@${MONGO_HOST:mongodb}:${MONGO_PORT:27017}/${MONGO_DATABASE:product_db}?authSource=admin

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
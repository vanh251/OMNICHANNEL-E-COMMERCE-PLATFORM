jwt:
  secret: ${JWT_SECRET}

server:
  port: ${PRODUCT_SERVICE_PORT:8082}

spring:
  application:
    name: product-service

  rabbitmq:
    publisher-confirm-type: simple
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:rabbit123}
    virtual-host: ${RABBITMQ_VHOST:/}

  mongodb:
    uri: ${SPRING_MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://${MONGO_ROOT_USERNAME:admin}:${MONGO_ROOT_PASSWORD:admin123}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:product_db}?authSource=admin}}

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:${SPRING_MONGODB_URI:mongodb://${MONGO_ROOT_USERNAME:admin}:${MONGO_ROOT_PASSWORD:admin123}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:product_db}?authSource=admin}}
      auto-index-creation: true

catalog:
  inventory:
    sync:
      enabled: ${CATALOG_INVENTORY_SYNC_ENABLED:true}
      backfill-enabled: ${CATALOG_INVENTORY_BACKFILL_ENABLED:false}
      poll-ms: ${CATALOG_INVENTORY_SYNC_POLL_MS:1000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

grpc:
  server:
    port: ${PRODUCT_GRPC_PORT:9090}
